<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ford Naghi Vessel Tracker</title>
<meta name="theme-color" content="#0b1f3f">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="https://logos-world.net/wp-content/uploads/2021/05/Ford-Logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vessel Tracker">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --navy:#0b1f3f; --navy2:#132c54; --ford:#1351d8; --ford-dark:#0c3ba5;
    --bg:#f2f4f8; --card:#ffffff; --line:#dde3ec; --text:#1c2536; --muted:#68738a;
    --green:#0f7a52; --green-bg:#e2f4ec; --amber:#8a5a0a; --amber-bg:#faeeda; --red:#a32d2d; --red-bg:#fcebeb;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top))}
  header img{height:34px;width:auto;background:#fff;border-radius:6px;padding:3px 8px}
  header .titles{line-height:1.25}
  header h1{font-size:16px;font-weight:600;letter-spacing:.2px}
  header .sub{font-size:11px;color:#aebcd6}
  .conn{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:11px;color:#aebcd6;white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;background:#8a93a6}
  .dot.live{background:#35d08a;box-shadow:0 0 0 3px rgba(53,208,138,.25)}
  .dot.err{background:#e24b4a}
  .layout{display:flex;height:calc(100dvh - 55px - env(safe-area-inset-top))}
  .panel{width:390px;min-width:320px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column}
  #map{flex:1;min-height:200px;background:#dce3ee}
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
  .stat{background:var(--bg);border-radius:8px;padding:10px 6px;text-align:center}
  .stat b{display:block;font-size:18px;font-weight:600;color:var(--navy)}
  .stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
  .fleet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .fleet-head h2{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
  .refresh{background:none;border:none;color:var(--ford);font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit;padding:4px 6px;border-radius:6px}
  .refresh:hover{background:#eef3fd}
  .refresh svg{width:13px;height:13px}
  .refresh.spin svg{animation:rot 1s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}
  .msg{padding:10px 12px;border-radius:8px;font-size:12px;margin-bottom:12px;line-height:1.55;display:none}
  .msg.show{display:block}
  .msg.ok{background:var(--green-bg);color:var(--green)}
  .msg.bad{background:var(--red-bg);color:var(--red)}
  .vlist{display:flex;flex-direction:column;gap:9px}
  .vcard{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;transition:box-shadow .15s}
  .vcard.live{border-left:4px solid var(--green);cursor:pointer}
  .vcard.live:hover{box-shadow:0 2px 10px rgba(11,31,63,.10)}
  .vcard .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .vname{font-size:13px;font-weight:600}
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;white-space:nowrap}
  .b-live{background:var(--green-bg);color:var(--green)}
  .b-wait{background:var(--amber-bg);color:var(--amber)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;margin-top:8px;font-size:11px;color:var(--muted)}
  .grid b{color:var(--text);font-weight:600}
  .upd{font-size:10px;color:var(--muted);margin-top:7px}
  .addrow{display:flex;gap:8px;margin-top:14px}
  .addrow input{flex:1;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;color:var(--text)}
  .addrow input:focus{outline:none;border-color:var(--ford);box-shadow:0 0 0 3px rgba(19,81,216,.12)}
  .addrow button{padding:10px 16px;background:var(--ford);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
  .addrow button:hover{background:var(--ford-dark)}
  footer.creds{margin-top:auto;padding-top:14px;font-size:10px;color:var(--muted);text-align:center}
  .ship-icon{display:flex;align-items:center;justify-content:center}
  .ship-icon div{width:26px;height:26px;border-radius:50%;background:var(--ford);color:#fff;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;font-size:13px}
  @media (max-width:760px){
    .layout{flex-direction:column}
    .panel{width:100%;min-width:0;max-height:55dvh;order:2;border-right:none;border-top:1px solid var(--line)}
    #map{order:1;height:45dvh;flex:none}
  }
</style>
</head>
<body>

<header>
  <img src="https://logos-world.net/wp-content/uploads/2021/05/Ford-Logo.png" alt="Ford">
  <div class="titles">
    <h1>Ford Naghi Vessel Tracker</h1>
    <div class="sub">MYNM Sales Operations · Live AIS</div>
  </div>
  <div class="conn"><span class="dot" id="connDot"></span><span id="connText">Starting...</span></div>
</header>

<div class="layout">
  <div class="panel">
    <div class="stats">
      <div class="stat"><b id="stTargets">0</b><span>Vessels</span></div>
      <div class="stat"><b id="stLive">0</b><span>Live</span></div>
      <div class="stat"><b id="stMsgs">0</b><span>Signals</span></div>
    </div>

    <div class="msg" id="msg"></div>

    <div class="fleet-head">
      <h2>Inbound fleet</h2>
      <button class="refresh" id="refreshBtn" onclick="refreshSheet()" title="Reload vessel list from the arrivals sheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"></path></svg>
        Sync sheet
      </button>
    </div>

    <div class="vlist" id="vlist">
      <div style="font-size:12px;color:var(--muted)">Loading fleet from the arrivals sheet...</div>
    </div>

    <div class="addrow">
      <input type="text" id="addMmsi" inputmode="numeric" maxlength="9" placeholder="Track an extra vessel by MMSI" onkeydown="if(event.key==='Enter')addVessel()">
      <button onclick="addVessel()">Add</button>
    </div>

    <footer class="creds">Fleet list: MYNM arrivals sheet · Matching: MMSI · Positions: aisstream.io · Nothing is stored</footer>
  </div>
  <div id="map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const SHEET_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTWkaAuL6kb0stuM94ldwa3Evegttmqz92-uZlYTqFLtkFkDYuuQNrKjT21yITle90mDTsiZkkkfo3D/pub?output=csv';
const API_KEY='c2327c4dcb3a85de1c18148ba13c519ae64dcc33';
const WS_URL="wss://stream.aisstream.io/v0/stream";
const JEDDAH = {lat: 21.47, lon: 39.17};
const BAB = {lat: 12.6, lon: 43.4};
const SUEZ = {lat: 29.9, lon: 32.55};
const GIB = {lat: 35.95, lon: -5.6};
const BOXES = [
  [[ 5, 98],[45,140]],
  [[-15, 44],[30, 98]],
  [[ 10, 31],[33, 52]],
  [[ 30, -7],[46, 37]],
  [[  5,-100],[50,-40]],
  [[  0,-45],[45,  0]],
  [[-40, 10],[ 5, 55]]
];
let map, ws=null, msgCount=0, targets=[], fleetWarnings=[], retryTimer=null, retryDelay=6000;
function haversineNm(a,b){
  const R=3440.065, toR=Math.PI/180;
  const dLat=(b.lat-a.lat)*toR, dLon=(b.lon-a.lon)*toR;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function routedNm(p){
  const inRedSea = p.lat>=12 && p.lat<=30.5 && p.lon>=32 && p.lon<=44;
  if(inRedSea) return haversineNm(p,JEDDAH);
  const inMed = p.lat>=30 && p.lat<=46 && p.lon>=-6 && p.lon<=36;
  if(inMed) return haversineNm(p,SUEZ)+haversineNm(SUEZ,JEDDAH);
  if(p.lon<-6) return haversineNm(p,GIB)+haversineNm(GIB,SUEZ)+haversineNm(SUEZ,JEDDAH);
  return haversineNm(p,BAB)+haversineNm(BAB,JEDDAH);
}
function regionName(lat,lon){
  if(lat>=29.5&&lat<=31.5&&lon>=32&&lon<=33.5) return 'Suez Canal';
  if(lat>=12&&lat<=30.5&&lon>=32&&lon<=44) return 'Red Sea';
  if(lat>=10&&lat<=16&&lon>=44&&lon<=52) return 'Gulf of Aden';
  if(lat>=30&&lat<=46&&lon>=-6&&lon<=36) return 'Mediterranean';
  if(lat>=0&&lat<=26&&lon>=52&&lon<=76) return 'Arabian Sea';
  if(lat>=-1&&lat<=7&&lon>=95&&lon<=105) return 'Malacca Strait';
  if(lat>=0&&lat<=25&&lon>=105&&lon<=122) return 'South China Sea';
  if(lat>=22&&lat<=42&&lon>=117&&lon<=136) return 'China coastal waters';
  if(lat>=-40&&lat<=10&&lon>=20&&lon<=100) return 'Indian Ocean';
  if(lat>=-40&&lat<=5&&lon>=10&&lon<=20) return 'Southern African waters';
  if(lat>=24&&lat<=46&&lon>=-82&&lon<=-64) return 'US East Coast';
  if(lon>=-100&&lon<=-6) return 'Atlantic Ocean';
  return 'At sea';
}
function splitCsvLine(line){
  const cells=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(q){ if(ch==='"'){ if(line[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else { if(ch==='"') q=true; else if(ch===','){ cells.push(cur); cur=''; } else cur+=ch; }
  }
  cells.push(cur);
  return cells.map(c=>c.trim());
}
function parseSheet(text){
  const rows=[];
  for(const raw of text.split(/\r?\n/)){
    if(!raw.trim()) continue;
    const c=splitCsvLine(raw);
    const name=(c[0]||'').trim();
    if(!name||/^vessel\s*name$/i.test(name)||/^total$/i.test(name)) continue;
    const mmsi=String(c[2]||'').replace(/\D/g,'');
    rows.push({name,origin:(c[1]||'').trim(),mmsi});
  }
  return rows;
}
function initMap(){
  map = L.map('map').setView([18, 55], 3);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap',maxZoom:18}).addTo(map);
  L.circleMarker([JEDDAH.lat, JEDDAH.lon],{radius:7,color:'#0b1f3f',fillColor:'#1351d8',fillOpacity:.9})
    .bindPopup('<b>Jeddah Islamic Port</b><br>Destination').addTo(map);
}
function setMsg(text,type,sticky){
  const m=document.getElementById('msg');
  m.textContent=text; m.className='msg show '+type;
  clearTimeout(m._t);
  if(!sticky) m._t=setTimeout(()=>m.className='msg',6000);
}
function setConn(state,text){
  document.getElementById('connDot').className='dot '+state;
  document.getElementById('connText').textContent=text;
}
async function decodeWsMessage(data){
  if(typeof data==='string') return JSON.parse(data);
  if(data instanceof Blob) return JSON.parse(await data.text());
  if(data instanceof ArrayBuffer) return JSON.parse(new TextDecoder('utf-8').decode(data));
  if(ArrayBuffer.isView(data)) return JSON.parse(new TextDecoder('utf-8').decode(data));
  throw new Error('Unsupported format');
}
async function fetchFleet(){
  const r=await fetch(SHEET_URL,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return parseSheet(await r.text());
}
function mergeFleet(rows){
  const byMmsi={}; for(const t of targets) if(t.mmsi) byMmsi[t.mmsi]=t;
  const next=[]; const seenMmsi=new Set();
  fleetWarnings=[];
  for(const row of rows){
    const mmsi=String(row.mmsi||'');
    if(!/^\d{9}$/.test(mmsi)){
      fleetWarnings.push(row.name+': invalid MMSI');
      continue;
    }
    if(seenMmsi.has(mmsi)){
      fleetWarnings.push(row.name+': duplicate MMSI '+mmsi);
      continue;
    }
    seenMmsi.add(mmsi);
    const prev=byMmsi[mmsi];
    if(prev){ prev.raw=row.name; prev.origin=row.origin; next.push(prev); }
    else next.push({raw:row.name,mmsi,origin:row.origin,live:false,marker:null,data:null,adhoc:false});
  }
  for(const t of targets) if(t.adhoc&&!seenMmsi.has(t.mmsi)) { seenMmsi.add(t.mmsi); next.push(t); }
  for(const t of targets) if(!next.includes(t)&&t.marker){ map.removeLayer(t.marker); }
  targets=next;
}
async function refreshSheet(){
  const btn=document.getElementById('refreshBtn');
  btn.classList.add('spin');
  try{
    mergeFleet(await fetchFleet());
    renderList();
    sendSubscription();
    const msg='Fleet synced: '+targets.filter(t=>!t.adhoc).length+' valid vessels'+(fleetWarnings.length?' (skipped: '+fleetWarnings.join('; ')+')':'');
    setMsg(msg,fleetWarnings.length?'bad':'ok',fleetWarnings.length>0);
  }catch(e){
    setMsg('Could not reach the arrivals sheet ('+e.message+').','bad');
  }
  btn.classList.remove('spin');
}
function addVessel(){
  const inp=document.getElementById('addMmsi');
  const mmsi=inp.value.replace(/\D/g,'');
  if(!mmsi) return;
  if(!/^\d{9}$/.test(mmsi)){ setMsg('MMSI must be exactly 9 digits.','bad'); return; }
  if(targets.some(t=>t.mmsi===mmsi)){ setMsg('MMSI '+mmsi+' is already tracked.','bad'); inp.value=''; return; }
  targets.push({raw:'MMSI '+mmsi,mmsi,origin:'',live:false,marker:null,data:null,adhoc:true});
  inp.value='';
  renderList();
  sendSubscription();
  setMsg('Listening for MMSI '+mmsi+'.','ok');
}
function matchTarget(meta){
  const mmsi=String(meta&&meta.MMSI||'');
  return targets.find(t=>t.mmsi===mmsi)||null;
}
function sendSubscription(){
  if(!ws||ws.readyState!==WebSocket.OPEN) return;
  const filters=[...new Set(targets.map(t=>t.mmsi).filter(m=>/^\d{9}$/.test(m)))];
  const sub={APIKey:API_KEY,BoundingBoxes:BOXES,FilterMessageTypes:["PositionReport","ShipStaticData"]};
  if(filters.length) sub.FiltersShipMMSI=filters.slice(0,200);
  ws.send(JSON.stringify(sub));
  setConn('','Confirming...');
}
function connect(){
  if(ws) try{ws.close()}catch(e){}
  setConn('','Connecting...');
  ws=new WebSocket(WS_URL);
  ws.binaryType='arraybuffer';
  ws.onopen=()=>sendSubscription();
  ws.onmessage=async ev=>{
    let m;
    try{ m=await decodeWsMessage(ev.data); }catch(e){
      setConn('err','Decode error');
      setMsg('Message decode failed: '+e.message,'bad');
      return;
    }
    if(m.MessageType==='SubscriptionConfirmation'){
      retryDelay=6000;
      setConn('live','Live');
      setMsg('Subscription confirmed. Listening for matching vessels.','ok');
      return;
    }
    const err=m.error||m.Error||m.Message?.Error;
    if(err){
      setConn('err','Stream error');
      setMsg('AIS stream error: "'+err+'". Will retry automatically.','bad',true);
      return;
    }
    msgCount++; retryDelay=6000;
    if(msgCount%50===0) document.getElementById('stMsgs').textContent=(msgCount/1000).toFixed(1)+'k';
    const meta=m.MetaData; if(!meta||meta.MMSI==null) return;
    const t=matchTarget(meta); if(!t) return;
    if(!t.data) t.data={};
    t.data.mmsi=meta.MMSI;
    if(meta.ShipName){
      t.data.aisName=String(meta.ShipName).trim();
      if(t.adhoc&&t.raw.startsWith('MMSI ')){ t.raw=t.data.aisName; }
    }
    t.data.time=new Date(meta.time_utc||meta.TimeUTC||Date.now());
    if(m.MessageType==="PositionReport"&&m.Message?.PositionReport){
      const p=m.Message.PositionReport;
      t.data.lat=p.Latitude??meta.Latitude;
      t.data.lon=p.Longitude??meta.Longitude;
      t.data.sog=p.Sog;
    } else if(meta.Latitude!=null){
      t.data.lat=t.data.lat??meta.Latitude; t.data.lon=t.data.lon??meta.Longitude;
    }
    if(m.MessageType==="ShipStaticData"&&m.Message?.ShipStaticData){
      const s=m.Message.ShipStaticData;
      t.data.dest=(s.Destination||'').trim();
    }
    if(t.data.lat!=null){
      if(!t.live){ t.live=true; document.getElementById('stLive').textContent=targets.filter(x=>x.live).length; }
      updateMarker(t);
    }
    renderList();
  };
  ws.onclose=e=>{
    const why=e.code&&e.code!==1000?(' code '+e.code):'';
    if(msgCount===0){
      setConn('err','Rejected'+why);
      setMsg('Subscription rejected. Check the MMSI list and retry.','bad',true);
    } else {
      setConn('','Reconnecting...');
    }
    retryTimer=setTimeout(connect,retryDelay);
    retryDelay=Math.min(retryDelay*2,60000);
  };
  ws.onerror=()=>setConn('err','Error');
}
function ageText(t){
  if(!t.data||!t.data.time) return '';
  const min=Math.floor((Date.now()-t.data.time.getTime())/60000);
  if(min<1) return 'just now';
  if(min<60) return min+'m ago';
  return Math.floor(min/60)+'h ago';
}
function updateMarker(t){
  const d=t.data, pos=[d.lat,d.lon];
  const nm=Math.round(routedNm({lat:d.lat,lon:d.lon}));
  const popup='<b>'+t.raw+'</b><br>'+regionName(d.lat,d.lon)+'<br>MMSI '+d.mmsi+'<br>Speed '+(d.sog||'?')+' kn<br>'+nm.toLocaleString()+' nm to Jeddah';
  if(!t.marker){
    const icon=L.divIcon({className:'ship-icon',html:'<div>&#9972;</div>',iconSize:[26,26],iconAnchor:[13,13]});
    t.marker=L.marker(pos,{icon}).bindPopup(popup).addTo(map);
    if(targets.filter(x=>x.live).length===1) map.setView(pos,5);
  } else { t.marker.setLatLng(pos); t.marker.setPopupContent(popup); }
}
function renderList(){
  document.getElementById('stTargets').textContent=targets.length;
  const el=document.getElementById('vlist');
  if(!targets.length){ el.innerHTML='<div style="font-size:12px;color:var(--muted)">No vessels in the arrivals sheet.</div>'; return; }
  const order=targets.map((t,i)=>({t,i})).sort((a,b)=>(b.t.live?1:0)-(a.t.live?1:0));
  el.innerHTML=order.map(({t,i})=>{
    const d=t.data;
    if(t.live&&d){
      const nm=Math.round(routedNm({lat:d.lat,lon:d.lon}));
      const stale=(Date.now()-d.time.getTime())>45*60000;
      return '<div class="vcard live" onclick="focusVessel('+i+')" style="'+(stale?'opacity:.65':'')+'">'
        +'<div class="top"><span class="vname">'+t.raw+'</span><span class="badge b-live">'+regionName(d.lat,d.lon)+'</span></div>'
        +(t.origin?'<div class="upd">'+t.origin+'</div>':'')
        +'<div class="grid">'
        +'<span>Speed <b>'+(d.sog!=null?d.sog.toFixed(1)+' kn':'?')+'</b></span>'
        +'<span>To Jeddah <b>'+nm.toLocaleString()+' nm</b></span>'
        +'</div>'
        +'<div class="upd">Signal '+ageText(t)+(stale?' · aging':'')+'</div>'
        +'</div>';
    }
    return '<div class="vcard"><div class="top"><span class="vname">'+t.raw+'</span><span class="badge b-wait">Listening</span></div>'
      +(t.origin?'<div class="upd">'+t.origin+'</div>':'')
      +'<div class="upd">MMSI '+t.mmsi+' · No signal yet.</div></div>';
  }).join('');
}
function focusVessel(i){
  const t=targets[i];
  if(t&&t.marker){ map.setView(t.marker.getLatLng(),7); t.marker.openPopup(); }
}
window.addEventListener('DOMContentLoaded',async()=>{
  initMap();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
  try{ mergeFleet(await fetchFleet()); renderList(); if(fleetWarnings.length) setMsg('Skipped: '+fleetWarnings.join('; ')+'','bad',true); }
  catch(e){ setMsg('Could not load the arrivals sheet ('+e.message+').','bad',true); }
  connect();
  setInterval(()=>{ if(targets.some(t=>t.live)) renderList(); },60000);
  setInterval(refreshSheet,30*60000);
});
</script>
</body></html>
